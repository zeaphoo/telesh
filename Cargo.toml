[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
futures = "0.3"
rand = "0.8"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.24"
# P2P data plane: hole-punched QUIC with relay fallback and built-in
# UPnP/PCP/NAT-PMP port mapping. `iroh-base` is the dependency-light subset
# (identity + addressing) used by the wire protocol.
iroh = "1.2"
iroh-base = "1.2"
# Data plane: agent-initiated TCP connection multiplexed with yamux.
yamux = "0.14"
# CBOR for the data-plane signalling stream; `serde_bytes` keeps byte strings
# native instead of turning them into arrays of integers.
ciborium = "0.2"
serde_bytes = "0.11"
bytes = "1"
# Length-prefixed framing (`codec`) and futures-io <-> tokio adaptation
# (`compat`) for the yamux streams.
tokio-util = { version = "0.7", features = ["codec", "compat"] }