name: Release

# 发布只由 v* 标签触发；workflow_dispatch 仅用于演练（publish=false 时只出 artifacts）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v0.1.0；publish=true 时必填）'
        type: string
        required: false
        default: ''
      publish:
        description: '创建 GitHub Release（否则只上传 artifacts）'
        type: boolean
        default: false
      with_mac:
        description: '构建 macOS 产物'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  verify:
    name: verify tag & versions
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifests
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -n "$tag" ]]; then
            version="$(./scripts/check-release-version.sh "$tag")"
          else
            version="$(./scripts/check-release-version.sh)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"

  linux-service:
    name: linux service packages (deb/rpm)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 缓存 key 带镜像标签：C 依赖（ring/aws-lc 等）按构建机 glibc 头文件编译，
      # 跨镜像复用 target/ 会出现 __isoc23_* 未定义符号。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-service
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            agent-ui/pnpm-lock.yaml
            server-ui/pnpm-lock.yaml
      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
      - name: Build packages
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-service
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error

  linux-app:
    name: linux desktop clients (deb/AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-app
          workspaces: |
            . -> target
            agent-app/src-tauri -> target
            server-app/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            agent-ui/pnpm-lock.yaml
            server-ui/pnpm-lock.yaml
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf \
            file
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build clients
        run: ./scripts/package-linux-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/linux-app/*
          if-no-files-found: error

  windows-app:
    name: windows desktop clients (nsis/msi + portable)
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-2022-app
          workspaces: |
            . -> target
            agent-app/src-tauri -> target
            server-app/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            agent-ui/pnpm-lock.yaml
            server-ui/pnpm-lock.yaml
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build clients
        shell: bash
        run: ./scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/windows/*
          if-no-files-found: error

  mac-app:
    name: macos desktop clients (${{ matrix.arch }})
    needs: verify
    if: github.event_name == 'push' || inputs.with_mac
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}-app
          workspaces: |
            . -> target
            agent-app/src-tauri -> target
            server-app/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            agent-ui/pnpm-lock.yaml
            server-ui/pnpm-lock.yaml
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build clients
        env:
          # 可选签名/公证 secrets；未配置时产出未签名 dmg（脚本会告警）。
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_API_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          MAC_NOTARY_API_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
          MAC_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
        run: ./scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/mac/*.dmg
          if-no-files-found: error

  release:
    name: publish release
    needs: [verify, linux-service, linux-app, windows-app, mac-app]
    # skipped 的 mac job（演练时关闭 with_mac）不阻塞发布；任一产物失败则不发 Release。
    if: >-
      always()
      && (startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish))
      && needs.linux-service.result == 'success'
      && needs.linux-app.result == 'success'
      && needs.windows-app.result == 'success'
      && (needs.mac-app.result == 'success' || needs.mac-app.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Require tag for manual publish
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" && -z "$INPUT_TAG" ]]; then
            echo "::error::手动发布必须提供 tag 输入（如 v0.1.0）。"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' \) \
            -exec cp -v {} release/ \;
          ls -lh release
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: ${{ format('telesh v{0}', needs.verify.outputs.version) }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: release/*
