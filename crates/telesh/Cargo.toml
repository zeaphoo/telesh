[package]
name = "telesh"
description = "telesh tunnel agent: expose a local port through the public edge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
telesh-protocol = { path = "../telesh-protocol" }
# P2P data plane (hole-punched QUIC + relay fallback + port mapping).
iroh = { workspace = true }
# Agent-initiated data plane: yamux over TCP + length-prefixed CBOR signalling.
yamux = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
# Router port mapping (UPnP/PCP/NAT-PMP) for the `p2p --map-tcp` public export.
portmapper = "0.19"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
url = "2"
sha2 = { workspace = true }
dashmap = { workspace = true }
tokio-tungstenite = { workspace = true }
axum = { workspace = true }
rust-embed = "8"
serde = { workspace = true }
serde_json = "1"