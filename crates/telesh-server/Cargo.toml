[package]
name = "telesh-server"
description = "telesh tunnel control server and edge ingress"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "telesh-server"
path = "src/main.rs"

[dependencies]
telesh-protocol = { path = "../telesh-protocol" }
# Accounts + sessions persistence.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = { workspace = true }
toml = "0.8"
# 数据面:agent 主动连入,yamux over TCP + 带长度前缀的 CBOR 信令。
yamux = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
# 可选的内嵌中继(`[relay] serve`),自托管部署用。
iroh-relay = { version = "1.2", features = ["server"] }
# 内嵌中继的 TLS 材料加载。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1"
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
httparse = "1"
rust-embed = "8"
serde_json = "1"

[dependencies.axum]
workspace = true
features = ["ws", "tokio"]